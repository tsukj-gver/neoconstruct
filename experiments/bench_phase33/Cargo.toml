[package]
name = "bench_phase33"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# 通过 path 依赖 construct-rs 的 rlib（crate-type 含 rlib）。
# 不启用 pyo3/extension-module，允许嵌入 Python 解释器（与 cargo test 同模式）。
construct-rs = { path = "../../construct-rs" }
pyo3 = "0.22"

[profile.release]
# 与 construct-rs 生产配置一致，使数据具有代表性。
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
