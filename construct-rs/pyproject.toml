[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "construct-rs"
description = "High-performance binary parsing/building for Python, powered by Rust"
requires-python = ">=3.7"
license = "MIT"
# 版本号从 Cargo.toml 的 [package] version 读取（maturin 默认行为）。
dynamic = ["version"]
keywords = ["binary", "parsing", "construct", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.maturin]
# Rust 扩展模块编译到 construct 包内（用户 import construct 而非 construct_rust）。
# 见 docs/架构设计.md §D.3。
module-name = "construct._construct_rust"
# Python 包源码目录：construct-rs/python/construct/。
# 这避免与工作区根目录的 construct/（Python 原版参考仓库）冲突。
python-source = "python"
# 显式启用 extension-module feature，避免在 cargo build/test 时
# 因链接 Python 解释器导致测试编译失败。
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
# 将 python/ 加入 sys.path，使 construct-rs 包覆盖任何 site-packages 中的同名包
# （例如为基准测试安装的 Python 原版 construct==2.10.70）。
pythonpath = ["python"]
testpaths = ["tests"]
# 输出摘要：失败用例的 traceback 全打印。
addopts = "-ra"
