[package]
name = "construct"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A declarative binary data parsing and building library (Rust port of Python construct)"
license = "MIT"

[dependencies]
thiserror = "2"
indexmap = "2"
enum_dispatch = "0.3"

[features]
default = []
byteorder = ["dep:byteorder"]
bigint = ["dep:num-bigint"]
compression = ["dep:flate2"]
# Python-first output layer (Phase 16). Enables pyo3 so that the compiled
# execution tree can produce PyObject directly, eliminating the Value
# intermediate type on the Python parse/build hot path. pyo3's num-bigint
# feature is required to convert Value::BigInt (i128) into a Python int.
#
# Note: `auto-initialize` is deliberately NOT enabled. It has a race
# condition when multiple test threads call `Python::with_gil` before the
# interpreter is started. Instead, `cargo test --features python` uses
# `ensure_test_python` (a `Once`-guarded `prepare_freethreaded_python`) in
# the test modules. Under `maturin develop`, the interpreter is already
# running (managed by the Python process), so no initialization is needed.
python = ["dep:pyo3", "pyo3/num-bigint", "dep:num-bigint"]

[dependencies.byteorder]
version = "1"
optional = true

[dependencies.num-bigint]
version = "0.4"
optional = true

[dependencies.flate2]
version = "1"
optional = true

[dependencies.pyo3]
version = "0.22"
optional = true
default-features = false

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["html_reports", "plotters", "cargo_bench_support"] }

# ---------------------------------------------------------------------------
# Benchmark targets (criterion requires `harness = false`)
# ---------------------------------------------------------------------------
[[bench]]
name = "core_constructs"
harness = false

[[bench]]
name = "gallery_formats"
harness = false

# ---------------------------------------------------------------------------
# Release / bench profile optimizations (see docs/模块设计-性能优化.md §4.2).
# LTO + single codegen-unit let the compiler inline dyn-Construct calls across
# crate boundaries, giving partial monomorphization benefits without changing
# any source code.
# ---------------------------------------------------------------------------
[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
