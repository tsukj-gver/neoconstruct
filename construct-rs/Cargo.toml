[package]
name = "construct-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance binary parsing/building for Python, powered by Rust"
license = "MIT"

[lib]
# Python 扩展模块名：编译后由 maturin 安装为 construct._construct_rust
name = "construct_rust"
# cdylib: 供 Python 加载的 cpython 扩展（.pyd/.so）
# rlib:   供 Rust 单元测试与未来可能的 Rust 调用方使用
crate-type = ["cdylib", "rlib"]

[dependencies]
# pyo3 是核心依赖（非 optional feature），Rust 内部直接操作 Python 对象。
# 见 AGENTS.md §0 核心原则与 docs/架构设计.md §D.1。
#
# extension-module 不放在默认依赖中：
# - cargo test 时需要嵌入 Python 解释器（链接 libpython），extension-module 会让符号未定义。
# - maturin 打包时通过 pyproject.toml 的 features = ["pyo3/extension-module"] 显式启用。
# 这是 pyo3 官方推荐做法：https://pyo3.rs/v0.22/testing.html
pyo3 = "0.22"
# 统一错误处理，见 docs/架构设计.md §B.8。
thiserror = "1.0"
# 执行树节点静态分派，见 docs/架构设计.md §C.2。
enum_dispatch = "0.3"

[features]
# 默认不启用 extension-module，使 cargo test 能初始化 Python 解释器（嵌入模式）。
# maturin 在 pyproject.toml 中显式启用 pyo3/extension-module。
default = []

# Release 构建优化（P0-1，参照 pydantic-core Cargo.toml）：
# - lto = "fat"：跨 crate 全量内联，使 pyo3 小函数（set_item、bind 等）内联进 validator。
# - codegen-units = 1：单编译单元，最大化优化空间。
# - strip = true：剥离符号，减小二进制体积。
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
