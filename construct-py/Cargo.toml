[package]
name = "construct-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "PyO3 bindings for construct-rs (Rust port of Python construct)"

[lib]
name = "construct_rust"
crate-type = ["cdylib"]

[dependencies]
construct = { path = "../construct-rs", features = ["byteorder", "bigint", "compression", "python"] }
pyo3 = { version = "0.22", features = ["num-bigint", "multiple-pymethods"] }
num-bigint = "0.4"
num-traits = "0.2"
indexmap = "2"

# The extension-module feature must NOT be enabled during `cargo test` because
# it prevents Python interpreter auto-initialization. Maturin enables it via
# `features = ["extension-module"]` in pyproject.toml.
[features]
default = []
extension-module = ["pyo3/extension-module"]

# Release profile: LTO + single codegen unit for best inlining across crate
# boundaries (mirrors construct-rs profile configuration).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1